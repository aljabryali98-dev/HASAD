<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وضع عدم الاتصال - نظام حصاد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', system-ui, -apple-system, sans-serif;
            background-color: #F4F9F6;
            margin: 0;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #064E3B;
            text-align: center;
            box-sizing: border-box;
        }
        .offline-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(6, 78, 59, 0.08);
        }
        .icon {
            width: 72px;
            height: 72px;
            background: #ECFDF5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px;
        }
        h2 { margin: 0 0 10px; font-weight: 800; }
        p { color: #475569; font-size: 15px; line-height: 1.6; margin: 0 0 25px; }
        .btn-retry {
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            color: #FFFFFF;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="icon">🌱</div>
        <h2>أنت غير متصل بالإنترنت</h2>
        <p>لا يمكن الوصول إلى خوادم نظام حصاد حالياً. يرجى التحقق من اتصال الشبكة وإعادة المحاولة.</p>
        <a href="javascript:window.location.reload();" class="btn-retry">إعادة المحاولة الآن</a>
    </div>
</body>
</html>
